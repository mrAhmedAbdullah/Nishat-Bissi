apiVersion: apps/v1
kind: Deployment
metadata:
  name: bissi-audit-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bissi-audit-service
  template:
    metadata:
      labels:
        app: bissi-audit-service
    spec:
      containers:
        - name: bissi-audit-service
          image: bissi/bissi-audit-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: SPRING_CONFIG_IMPORT
              value: "optional:configserver:http://config-server:8888"
---
apiVersion: v1
kind: Service
metadata:
  name: bissi-audit-service
spec:
  selector:
    app: bissi-audit-service
  ports:
    - port: 8082
      targetPort: 8082
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: bissi-audit-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bissi-audit-service
  template:
    metadata:
      labels:
        app: bissi-audit-service
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres-service 5432 && nc -z config-server 8888; do
                echo "Waiting for Postgres and Config Server..."
                sleep 3
              done
      containers:
        - name: bissi-audit-service
          image: bissi/bissi-audit-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: SPRING_CONFIG_IMPORT
              value: "optional:configserver:http://config-server:8888"
---
apiVersion: v1
kind: Service
metadata:
  name: bissi-audit-service
spec:
  selector:
    app: bissi-audit-service
  ports:
    - port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bissi-core-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bissi-core-service
  template:
    metadata:
      labels:
        app: bissi-core-service
    spec:
      initContainers:
        - name: wait-for-audit-and-infra
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres-service 5432 && nc -z config-server 8888 && nc -z bissi-audit-service 8082; do
                echo "Waiting for Postgres, Config Server, and Audit Service..."
                sleep 3
              done
      containers:
        - name: bissi-core-service
          image: bissi/bissi-core-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
            - name: SPRING_CONFIG_IMPORT
              value: "optional:configserver:http://config-server:8888"
---
apiVersion: v1
kind: Service
metadata:
  name: bissi-core-service
spec:
  selector:
    app: bissi-core-service
  ports:
    - port: 8081
      targetPort: 8081